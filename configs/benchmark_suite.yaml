data_dir: "data"
results_dir: "results"
random_seed: 42

benchmarks:
  batch:
    - name: "uci_adult"
      enabled: true
      max_rows: 10000
    - name: "uci_bank_marketing"
      enabled: true
      max_rows: 10000
    - name: "uci_covertype"
      enabled: true
      max_rows: 10000
    - name: "openml_cc18"
      enabled: true
      max_tasks: 1
      max_rows_per_task: 4000
  stream:
    - name: "elec2"
      enabled: true
      max_samples: 4000
    - name: "assistments"
      enabled: true
      max_samples: 10000
      assistments_url: "https://drive.google.com/uc?export=download&id=0B_hO8cnpcIMgUGZzRnh3bHJrSjQ"

systems:
  batch:
    - "logreg"
    - "random_forest"
    - "hist_gb"
  stream:
    - "river_logreg"
    - "river_nb"
    - "river_hoeffding_tree"
